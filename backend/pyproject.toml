[project]
name = "nyaya"
version = "0.1.0"
description = "NyayaRAG: citation-grounded legal Q&A over India's BNS, BNSS and BSA"
license = { text = "MIT" }
requires-python = ">=3.11,<3.12"
dependencies = [
    "pymupdf>=1.24",
    "rapidfuzz>=3.9",
    "pandas>=2.2",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
    "tokenizers>=0.19",
    "huggingface-hub>=0.23",
    "requests>=2.32",
    "kaggle>=1.6",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["nyaya"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["data"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # legal text uses en/em dashes on purpose

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "data: needs downloaded data in data/raw/ (skips when absent)",
]
